
name: Collect Stock Universe

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect listed companies
        run: node scripts/collect_universe.js
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Upload stock universe
        uses: actions/upload-artifact@v4
        with:
          name: stock-universe
          path: data/stock_universe.json
          if-no-files-found: error
